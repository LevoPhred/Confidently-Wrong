<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Confidently Wrong — Player Console</title>
<link rel="stylesheet" href="sprites.css">
<style>
  :root{
    --case: #DAD3EA;       /* pale lavender ventilator casing */
    --case-dark: #C7BEDF;
    --purple: #6B4FA0;     /* main purple accent, like the ReVel trim */
    --purple-dark: #4B3574;
    --navy: #14131E;       /* dark "screen" background */
    --lcd-green: #7CFC9A;
    --red: #B23B26;
    --yellow: #E8B93A;
    --ink: #241F2E;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; background:#0E0D14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  body{ padding: 14px 10px 24px; min-height:100%; }

  /* ---- Device casing ---- */
  .device{
    width:100%; max-width:420px;
    background: linear-gradient(180deg, var(--case), var(--case-dark));
    border: 3px solid var(--purple-dark);
    border-radius: 28px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.35), 0 18px 30px rgba(0,0,0,0.5);
    padding: 14px 14px 20px;
    position: relative;
  }
  .device::before{
    /* two little perforated vents at the top, like the ReVel unit's grille */
    content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:70px; height:8px; border-radius:6px;
    background: repeating-linear-gradient(90deg, var(--purple-dark) 0 4px, transparent 4px 7px);
    opacity:0.6;
  }

  .topbar{
    margin-top: 14px;
    background:#fff; border-radius: 14px; padding: 8px 10px;
    text-align:center; box-shadow: inset 0 0 0 2px var(--case-dark);
  }
  .topbar .brand{ font-weight:800; letter-spacing:0.03em; font-size: 15px; color: var(--ink); }
  .topbar .subbrand{ font-size:9px; letter-spacing:0.18em; color:#8b83a3; margin-top:1px; }

  /* ---- Screen (mimics the dark waveform/status display) ---- */
  .screen{
    margin-top: 12px;
    background: var(--navy);
    border-radius: 14px;
    padding: 14px 12px;
    box-shadow: inset 0 0 0 3px #050509, inset 0 2px 10px rgba(0,0,0,0.6);
    color:#fff;
    min-height: 240px;
  }
  .screen-row{ display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#9d97c4; letter-spacing:0.05em; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .dot.connected{ background:#3fd15c; box-shadow:0 0 6px #3fd15c; }
  .dot.connecting{ background:var(--yellow); box-shadow:0 0 6px var(--yellow); }
  .dot.local{ background:#888; }
  .dot.error{ background:var(--red); box-shadow:0 0 6px var(--red); }

  .avatar-wrap{ display:flex; flex-direction:column; align-items:center; margin-top: 10px; }
  .avatar-ring{
    width: 92px; height:92px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a2840, #0c0b14);
    border: 3px solid var(--purple);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 4px rgba(107,79,160,0.25);
  }
  .avatar-ring .piece-sprite{ width:56px; height:56px; background-size:contain; background-repeat:no-repeat; background-position:center; }
  .player-name{ margin-top:8px; font-weight:700; font-size:16px; }
  .player-tile{ font-size:10px; color:#9d97c4; margin-top:2px; letter-spacing:0.04em; }

  .score-lcd{
    margin-top:14px; background:#050509; border-radius:8px; padding:8px 10px;
    display:flex; justify-content:space-between; align-items:baseline;
    box-shadow: inset 0 0 0 1px #2a2840;
  }
  .score-lcd .label{ font-size:10px; letter-spacing:0.15em; color:#6f6890; }
  .score-lcd .value{ font-family:'Courier New', monospace; font-size:26px; color:var(--lcd-green); text-shadow:0 0 6px rgba(124,252,154,0.6); }

  .turn-status{
    margin-top:14px; text-align:center; font-size:13px; font-weight:700;
    padding:8px 6px; border-radius:8px; letter-spacing:0.02em;
  }
  .turn-status.mine{ background:rgba(63,209,92,0.15); color:#7CFC9A; }
  .turn-status.waiting{ background:rgba(255,255,255,0.06); color:#9d97c4; }

  /* ---- Big rotary knob (the "spin" control) ---- */
  .knob-area{ display:flex; flex-direction:column; align-items:center; margin-top:18px; }
  .knob{
    width:120px; height:120px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #8a6cc4, var(--purple) 55%, var(--purple-dark) 100%);
    border: 4px solid var(--purple-dark);
    box-shadow: 0 6px 0 var(--purple-dark), 0 10px 18px rgba(0,0,0,0.4);
    color:#fff; font-weight:800; font-size:13px; letter-spacing:0.03em;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding: 10px;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .knob::before{
    content:""; position:absolute; width:10px; height:10px; border-radius:50%;
    background: var(--yellow); margin-top:-46px; box-shadow:0 0 6px var(--yellow);
  }
  .knob:active:not(.disabled){ transform: translateY(4px); box-shadow: 0 2px 0 var(--purple-dark), 0 4px 10px rgba(0,0,0,0.4); }
  .knob.disabled{ background: radial-gradient(circle at 35% 30%, #9a94ad, #77718c 55%, #5c5670 100%); border-color:#5c5670; box-shadow:0 6px 0 #5c5670; cursor:default; opacity:0.75; }
  .knob-caption{ margin-top:10px; font-size:11px; color:#c9c1e6; letter-spacing:0.06em; text-align:center; min-height:14px; }

  /* ---- Bottom control strip (only the buttons this game actually needs) ---- */
  .bottombar{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; gap:8px; }
  .mini-btn{
    flex:0 0 auto; background:var(--purple); color:#fff; border:none; border-radius:8px;
    padding:8px 12px; font-size:11px; font-weight:700; letter-spacing:0.03em; cursor:pointer;
    box-shadow: 0 3px 0 var(--purple-dark);
  }
  .mini-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--purple-dark); }
  .room-chip{ flex:1; text-align:right; font-size:10px; color:#5b5473; letter-spacing:0.05em; }

  /* ---- Join screen ---- */
  .join-title{ font-size:13px; color:#c9c1e6; letter-spacing:0.05em; text-align:center; margin-bottom:10px; }
  .seat-list{ display:flex; flex-direction:column; gap:8px; }
  .seat{
    display:flex; align-items:center; gap:10px;
    background:#1c1a2b; border:1px solid #322e48; border-radius:10px; padding:8px 10px;
    cursor:pointer;
  }
  .seat:active{ background:#262239; }
  .seat .piece-sprite{ width:34px; height:34px; background-size:contain; background-repeat:no-repeat; background-position:center; flex:0 0 auto; }
  .seat .seat-info{ flex:1; }
  .seat .seat-name{ font-size:13px; font-weight:700; color:#fff; }
  .seat .seat-status{ font-size:10px; color:#8b83a3; margin-top:1px; }
  .seat .seat-status.taken{ color:var(--yellow); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="device">
  <div class="topbar">
    <div class="brand">CONFIDENTLY WRONG</div>
    <div class="subbrand">FLIGHT CONSOLE &middot; PLAYER UNIT</div>
  </div>

  <!-- JOIN SCREEN: shown until this device has claimed a seat -->
  <div class="screen" id="joinScreen">
    <div class="screen-row"><span><span class="dot local" id="joinDot"></span><span id="joinConnLabel">CONNECTING&hellip;</span></span><span id="joinRoomLabel">ROOM ----</span></div>
    <div class="join-title" style="margin-top:14px;">TAP YOUR SEAT TO JOIN</div>
    <div class="seat-list" id="seatList"></div>
  </div>

  <!-- MAIN SCREEN: this device's own player -->
  <div class="screen hidden" id="mainScreen">
    <div class="screen-row"><span><span class="dot local" id="mainDot"></span><span id="mainConnLabel">CONNECTING&hellip;</span></span><span id="mainRoomLabel">ROOM ----</span></div>
    <div class="avatar-wrap">
      <div class="avatar-ring"><div class="piece-sprite" id="mySprite"></div></div>
      <div class="player-name" id="myName">&mdash;</div>
      <div class="player-tile" id="myTile"></div>
    </div>
    <div class="score-lcd">
      <div class="label">SCORE</div>
      <div class="value" id="myScore">0</div>
    </div>
    <div class="turn-status waiting" id="turnStatus">WAITING&hellip;</div>
  </div>

  <div class="knob-area">
    <button class="knob disabled" id="spinBtn"><span>PRESS TO SPIN</span></button>
    <div class="knob-caption" id="knobCaption"></div>
  </div>

  <div class="bottombar">
    <button class="mini-btn hidden" id="leaveBtn">LEAVE SEAT</button>
    <div class="room-chip" id="roomChip"></div>
  </div>
</div>

<script src="game-store.js"></script>
<script>
// =====================================================================
// PLAYER CONSOLE
// A thin phone-friendly view over the exact same GameStore the Board
// uses (see game-store.js) — no separate backend, no install, just a
// second page in the same room. Each phone "claims" one of the four
// seats (players p1-p4) and remembers that choice in localStorage so a
// page reload doesn't bounce the player back to the join screen.
// =====================================================================

var STORAGE_KEY = 'cw_playerId_' + GameStore.getState().roomCode;
var myPlayerId = localStorage.getItem(STORAGE_KEY);

var joinScreenEl = document.getElementById('joinScreen');
var mainScreenEl = document.getElementById('mainScreen');
var seatListEl = document.getElementById('seatList');
var spinBtnEl = document.getElementById('spinBtn');
var knobCaptionEl = document.getElementById('knobCaption');
var leaveBtnEl = document.getElementById('leaveBtn');

function claimSeat(id){
  var state = GameStore.getState();
  GameStore.setPlayer(id, { connected: true });
  GameStore.addLog(state.players[id].name + ' joined from a phone.');
  localStorage.setItem(STORAGE_KEY, id);
  myPlayerId = id;
  render(GameStore.getState());
}

function leaveSeat(){
  if (!myPlayerId) return;
  GameStore.setPlayer(myPlayerId, { connected: false });
  localStorage.removeItem(STORAGE_KEY);
  myPlayerId = null;
  render(GameStore.getState());
}
leaveBtnEl.addEventListener('click', leaveSeat);

// Guards against double-taps firing two rolls for one press, the same
// pattern the Board uses for its own PRESS TO MOVE button.
var spinLocked = false;
spinBtnEl.addEventListener('click', function(){
  if (spinLocked) return;
  var state = GameStore.getState();
  if (state.phase !== 'TURN_START' || state.currentPlayerId !== myPlayerId) return;
  spinLocked = true;
  spinMoveIndicator(); // shared with the Board — see game-store.js
  setTimeout(function(){ spinLocked = false; }, 1200);
});

function connectionDotClass(){
  var status = GameStore.getConnectionStatus();
  if (status === 'local' && GameStore.wantsFirebase()) return 'connecting';
  if (status === 'connected') return 'connected';
  if (status === 'error') return 'error';
  return 'local';
}
function connectionLabel(){
  var status = GameStore.getConnectionStatus();
  if (status === 'local' && GameStore.wantsFirebase()) return 'CONNECTING\u2026';
  if (status === 'connected') return 'LIVE';
  if (status === 'error') return 'CONNECTION ERROR';
  return 'OFFLINE MODE';
}

function renderJoinScreen(state){
  document.getElementById('joinDot').className = 'dot ' + connectionDotClass();
  document.getElementById('joinConnLabel').textContent = connectionLabel();
  document.getElementById('joinRoomLabel').textContent = 'ROOM ' + state.roomCode;

  var html = '';
  state.turnOrder.forEach(function(id){
    var p = state.players[id];
    html += '<div class="seat" onclick="claimSeat(\'' + id + '\')">' +
      '<div class="piece-sprite ' + p.sprite + '"></div>' +
      '<div class="seat-info">' +
        '<div class="seat-name">' + p.name + '</div>' +
        '<div class="seat-status' + (p.connected ? ' taken' : '') + '">' + (p.connected ? 'ALREADY CONNECTED \u2014 TAP TO TAKE OVER' : 'OPEN SEAT') + '</div>' +
      '</div>' +
    '</div>';
  });
  seatListEl.innerHTML = html;
}

function renderMainScreen(state){
  var p = state.players[myPlayerId];
  if (!p){
    // the saved player id no longer exists in this room (e.g. a reset) — bounce back to join
    localStorage.removeItem(STORAGE_KEY);
    myPlayerId = null;
    render(state);
    return;
  }
  document.getElementById('mainDot').className = 'dot ' + connectionDotClass();
  document.getElementById('mainConnLabel').textContent = connectionLabel();
  document.getElementById('mainRoomLabel').textContent = 'ROOM ' + state.roomCode;
  document.getElementById('mySprite').className = 'piece-sprite ' + p.sprite;
  document.getElementById('myName').textContent = p.name;
  document.getElementById('myTile').textContent = p.tile || '';
  document.getElementById('myScore').textContent = p.score.toLocaleString();
  document.getElementById('roomChip').textContent = 'ROOM ' + state.roomCode;

  var myTurn = state.currentPlayerId === myPlayerId && state.phase === 'TURN_START';
  var statusEl = document.getElementById('turnStatus');
  if (myTurn){
    statusEl.textContent = 'YOUR TURN \u2014 PRESS THE KNOB';
    statusEl.className = 'turn-status mine';
  } else {
    var currentName = state.players[state.currentPlayerId] ? state.players[state.currentPlayerId].name : '\u2014';
    statusEl.textContent = state.phase === 'TURN_START' ? ('WAITING ON ' + currentName.toUpperCase()) : 'IN PROGRESS\u2026';
    statusEl.className = 'turn-status waiting';
  }

  spinBtnEl.classList.toggle('disabled', !myTurn);
  knobCaptionEl.textContent = myTurn ? '' : 'locked until it\u2019s your turn';
}

function render(state){
  if (myPlayerId && state.players[myPlayerId]){
    joinScreenEl.classList.add('hidden');
    mainScreenEl.classList.remove('hidden');
    leaveBtnEl.classList.remove('hidden');
    renderMainScreen(state);
  } else {
    mainScreenEl.classList.add('hidden');
    joinScreenEl.classList.remove('hidden');
    leaveBtnEl.classList.add('hidden');
    document.getElementById('roomChip').textContent = 'ROOM ' + state.roomCode;
    renderJoinScreen(state);
  }
}

GameStore.subscribe(render);
</script>
</body>
</html>
